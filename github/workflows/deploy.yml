name: Desplegar página estática en GitHub Pages

on:
  # Ejecutar cuando se haga push a main
  push:
    branches: ["main"]

  # Permitir ejecución manual desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permitir un solo despliegue simultáneo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # Descargar el código del repositorio
      - name: Checkout
        uses: actions/checkout@v6

      # Configurar GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Subir los archivos de la página
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Carpeta donde se encuentra index.html
          path: "."

      # Publicar en GitHub Pages
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4